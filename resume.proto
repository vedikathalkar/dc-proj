syntax = "proto3";

service ResumeService {
    rpc ScreenResume (ResumeRequest) returns (ResumeResponse);
}

message ResumeRequest {
    string candidate_name = 1;
    string resume_text = 2;
    string job_role = 3;
    int64 lamport_time = 4;
}

message ResumeResponse {
    string candidate_name = 1;
    float match_score = 2;
    string status = 3;
    string matched_skills = 4;
    int64 lamport_time = 5;
}